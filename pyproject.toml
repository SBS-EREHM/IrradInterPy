[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "irradinterpy"
version = "1.7"
description = "NIST IrradInterPy interpolation functions, packaged for pip (Sea-Bird fork)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[tool.setuptools]
packages = ["irradinterpy"]
package-dir = { irradinterpy = "src/Functions" }
